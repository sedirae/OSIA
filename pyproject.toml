[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osia"
version = "0.1.0"
description = "OSIA — moteur d'investigation OSINT contrôlable sur sources publiques"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "asyncpg>=0.29",
  "pydantic>=2.5",
  "aiohttp>=3.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "pgserver>=0.1",
]

[project.scripts]
osia = "osia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"osia.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
