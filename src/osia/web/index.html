<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'">
<title>OSIA</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">OSIA</a>
  <span id="mode-badge" class="badge">…</span>
  <span class="spacer"></span>
  <button id="auth-button" type="button" hidden>Jeton d'accès</button>
</header>
<main id="app" tabindex="-1">
  <p class="muted">Chargement…</p>
</main>
<dialog id="auth-dialog" aria-labelledby="auth-title">
  <form method="dialog" id="auth-form">
    <h2 id="auth-title">Authentification requise (mode serveur)</h2>
    <p class="muted">Jeton Bearer de l'instance. Conservé uniquement pour cette session.</p>
    <label for="auth-token">Jeton</label>
    <input id="auth-token" name="token" type="password" autocomplete="current-password" required>
    <menu>
      <button type="button" id="auth-cancel">Annuler</button>
      <button type="submit" value="ok" class="primary">Se connecter</button>
    </menu>
  </form>
</dialog>
<script src="/static/app.js" defer></script>
</body>
</html>
