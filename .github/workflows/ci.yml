# CON-19 / T3.14 : CI intégrable aux revues — tests reproductibles hors ligne.
# PostgreSQL est embarqué (pgserver) : aucun service externe, aucun appel réseau, aucune dépense.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (hors ligne, PostgreSQL embarqué)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation (dépendances + extra test)
        run: python -m pip install -e ".[test]"
      - name: Tests pytest (T3.14 — multicouches, simulations, non-régression)
        # Suite complète, sans exclusion (audit F16 : le test budgétaire désélectionné était
        # corrigé — profil "approfondi" — et réactivé ; aucune désélection inexpliquée).
        run: python -m pytest -q
